# Tests. Runs on every push and pull request, and produces nothing installable.
#
# Split from release.yml deliberately. Releases are built only from tags, so that every artefact
# that exists anywhere corresponds to a name somebody can ask for — no snapshot builds to be
# confused for a release, and no way to install something that was never tagged.
#
# The tests still run continuously, though, because the alternative is going blind between releases:
# a break would sit undiscovered until the moment of tagging, which is the worst time to find it and
# the point at which the pressure to ship anyway is highest.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # Formatting is checked rather than applied: a CI job that rewrites source produces diffs
      # nobody asked for and hides the fact that someone skipped gofmt.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      # The race detector is on despite this program having no goroutines, because the day one is
      # added is exactly the day nobody remembers to turn it on.
      - name: test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage
        run: go tool cover -func=coverage.out

  # Cross-compilation is checked here rather than at release time. The target is a Raspberry Pi and
  # the code contains a linux-only GPIO implementation behind build tags, so an arm64 build breaking
  # is both plausible and invisible to a test run on amd64.
  cross:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: build for every target
        run: |
          set -eux
          for target in linux/arm64 linux/arm linux/amd64 darwin/arm64 darwin/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -o /dev/null ./...
          done

      # The GPIO layer is compiled out on darwin, so its tests must still pass there: that is the
      # stub that returns an error rather than a misleading false.
      - name: vet the non-linux build
        run: GOOS=darwin GOARCH=arm64 go vet ./...
