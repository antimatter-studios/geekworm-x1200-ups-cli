name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # Formatting is checked rather than applied: a CI job that rewrites source produces diffs
      # nobody asked for and hides the fact that someone skipped gofmt.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      # The race detector is on despite this program having no goroutines, because the day one is
      # added is exactly the day nobody remembers to turn it on.
      - name: test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage
        run: go tool cover -func=coverage.out

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64   # the Raspberry Pi 5 this is for
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64   # so the tests can be developed away from the hardware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # CGO_ENABLED=0 because nothing here links against C, and a static binary is what makes
      # installing it onto the Pi a copy rather than a dependency problem.
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          go build -ldflags "-s -w -X main.version=$version" \
            -o "dist/x1200-${GOOS}-${GOARCH}" ./cmd/x1200

      - uses: actions/upload-artifact@v4
        with:
          name: x1200-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Checksums are published alongside the binaries so that whatever installs this can verify
      # what it fetched, rather than trusting the transfer.
      - name: checksums
        run: cd dist && sha256sum x1200-* > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/x1200-*
            dist/SHA256SUMS
