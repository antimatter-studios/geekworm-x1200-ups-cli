# GoReleaser builds, packages and publishes the binaries a release consists of.
#
# The point of it here is not convenience. Whatever installs this on the Pi has to verify what it
# downloaded, and that means every release needs the same set of artefacts, built the same way, with
# a checksum file alongside them. Doing that by hand in a workflow is where release processes rot:
# one architecture quietly stops being built, and nobody notices until the machine that needed it
# is the one being rebuilt.
version: 2

project_name: x1200

before:
  hooks:
    - go mod tidy
    # Nothing gets released that has not been tested. A tag is exactly the moment when skipping this
    # is most tempting and least wise.
    - go test ./...

builds:
  - id: x1200
    main: ./cmd/x1200
    binary: x1200

    # Static binaries, because installing this on a Raspberry Pi should be a copy rather than a
    # dependency problem. Nothing here links against C, so there is no cost to it.
    env:
      - CGO_ENABLED=0

    # -trimpath keeps the building machine's directory layout out of the binary. Without it the
    # paths of whoever ran the build are embedded in it, which is how RetroPie's binaries on this
    # very Pi still name a home directory that has not existed for years.
    flags:
      - -trimpath

    # The version path is internal/build rather than main: a build carries three facts about its
    # own provenance and they belong beside the code that interprets them.
    #
    # Commit and date are stamped even though Go embeds the revision on its own, because a release
    # is the one build where the identity must not depend on how it was invoked — `goreleaser` may
    # build from a detached checkout where the VCS stamping is absent.
    ldflags:
      - -s -w
      - -X github.com/antimatter-studios/geekworm-x1200-ups-cli/internal/build.Version={{ .Version }}
      - -X github.com/antimatter-studios/geekworm-x1200-ups-cli/internal/build.Commit={{ .FullCommit }}
      - -X github.com/antimatter-studios/geekworm-x1200-ups-cli/internal/build.Date={{ .Date }}

    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64   # the Raspberry Pi 5 this is written for, and Apple silicon
      - arm     # 32-bit Raspberry Pi OS, which is still what a lot of older cards are running
    goarm:
      - "7"

    ignore:
      # There is no 32-bit ARM macOS and never was.
      - goos: darwin
        goarch: arm

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    # The tarball carries the units too. A tarball user gets no package scripts, so without these
    # they would have to copy the unit text out of the README — which is how a documented copy comes
    # to differ from the real one. `x1200 systemd` prints the same content, so there are two ways to
    # get it right and none to get a stale version.
    files:
      - README.md
      - src: packaging/x1200.service
        dst: systemd/x1200.service
      - src: packaging/x1200.timer
        dst: systemd/x1200.timer

# A Debian package as well as a tarball, because Raspberry Pi OS is Debian and `apt install ./x1200.deb`
# leaves a record in dpkg that a copied binary does not. Anything auditing the machine later can then
# see where the file came from.
nfpms:
  - id: deb
    package_name: x1200
    formats:
      - deb
    maintainer: Antimatter Studios
    description: Reports battery and power state of a Geekworm X1200 UPS HAT on a Raspberry Pi.
    homepage: https://github.com/antimatter-studios/geekworm-x1200-ups-cli
    section: utils
    bindir: /usr/bin

    contents:
      - src: packaging/x1200.service
        dst: /lib/systemd/system/x1200.service
      - src: packaging/x1200.timer
        dst: /lib/systemd/system/x1200.timer

    scripts:
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh

checksum:
  # The file whatever installs this verifies a download against, so that installing it is checked
  # rather than trusted.
  name_template: checksums.txt

# Only used by `make snapshot` locally now. CI does not build snapshots: releases come from tags
# only, so that nothing installable exists that does not correspond to a tag.
snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Changes
      order: 0
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  footer: |
    Verify a download against `checksums.txt` before installing it.
